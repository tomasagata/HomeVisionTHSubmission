services:
  backend:
    build: ./backend
    expose:
      - "8000"
    restart: unless-stopped
    mem_limit: 4g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build: ./frontend
    ports:
      - "4173:4173"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
