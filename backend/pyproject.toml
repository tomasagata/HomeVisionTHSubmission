[project]
name = "homevisionthsubmission"
version = "0.1.0"
description = "Detect checkboxes in document images and classify them as checked or unchecked"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers[torch]>=5.22.1",
    "ultralytics>=8.4.197",
]

[dependency-groups]
dev = [
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
